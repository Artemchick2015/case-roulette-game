<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Case Roulette - Telegram Game</title>
    <script src="https://telegram.org/js/games.js"></script>
    <style>
        /* ОСНОВНІ СТИЛІ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            overflow-x: hidden;
        }
        
        /* ЕКРАН ЗАВАНТАЖЕННЯ */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.3s ease;
        }
        
        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            border-top-color: #ffd700;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ОСНОВНИЙ КОНТЕНТ */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .header {
            text-align: center;
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            margin-top: 10px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #ffd700;
        }
        
        .balance-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            text-align: center;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }
        
        .balance-card h2 {
            font-size: 16px;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .balance-amount {
            font-size: 36px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .star-icon {
            color: #ffd700;
        }
        
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
        }
        
        .case {
            background: linear-gradient(135deg, var(--case-color) 0%, rgba(0,0,0,0.4) 100%);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            border: 2px solid rgba(255, 255, 255, 0.1);
            min-height: 140px;
        }
        
        .case:active {
            transform: scale(0.98);
        }
        
        .case-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        
        .case-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .case-price {
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        /* КНОПКИ */
        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        
        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            color: white;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        
        .btn-buy {
            background: linear-gradient(45deg, #4CAF50, #2E7D32);
        }
        
        .btn-stats {
            background: linear-gradient(45deg, #667eea, #764ba2);
        }
        
        /* СТАТИСТИКА */
        .stats {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 15px;
            width: 100%;
            display: flex;
            justify-content: space-around;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 3px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
        }
        
        /* СПОВІЩЕННЯ */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(45deg, #4CAF50, #8BC34A);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 1001;
            font-weight: bold;
            transition: transform 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            text-align: center;
        }
        
        .notification.show {
            transform: translateX(-50%) translateY(0);
        }
        
        /* МОДАЛЬНІ ВІКНА */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }
        
        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 10px;
        }
        
        /* МОБІЛЬНІ СТИЛІ */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            .cases-grid {
                grid-template-columns: 1fr;
            }
            
            .case {
                min-height: 130px;
                padding: 15px;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .btn {
                padding: 15px;
            }
            
            .balance-amount {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <!-- ЕКРАН ЗАВАНТАЖЕННЯ -->
    <div id="loadingScreen">
        <div class="loader"></div>
        <div style="color: #ffd700; font-size: 18px; font-weight: bold; margin-bottom: 5px;">
            Завантаження гри...
        </div>
        <div style="color: rgba(255,255,255,0.5); font-size: 14px;">
            Case Roulette
        </div>
    </div>
    
    <!-- ОСНОВНИЙ ІНТЕРФЕЙС -->
    <div class="container" id="mainContainer" style="display: none;">
        <div class="header">
            <h1>🎰 Case Roulette</h1>
            <p>Відкривай кейси та вигравай Stars!</p>
        </div>
        
        <div class="balance-card">
            <h2>Ваш баланс</h2>
            <div class="balance-amount">
                <span class="star-icon">⭐</span>
                <span id="balance">0</span>
            </div>
        </div>
        
        <div class="cases-grid" id="casesContainer">
            <!-- Кейси генеруються JavaScript -->
        </div>
        
        <div class="controls">
            <button class="btn btn-buy" onclick="game.showPaymentModal()">💳 Поповнити</button>
            <button class="btn btn-stats" onclick="game.showStats()">📊 Статистика</button>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Відкрито кейсів</div>
                <div class="stat-value" id="casesCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Виграно Stars</div>
                <div class="stat-value" id="totalWon">0</div>
            </div>
        </div>
    </div>
    
    <!-- МОДАЛЬНЕ ВІКНО ОПЛАТИ -->
    <div class="modal-overlay" id="paymentModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">💰 Поповнення балансу</div>
                <p>Виберіть кількість Telegram Stars</p>
            </div>
            
            <div style="margin-bottom: 20px;">
                <input type="number" id="starsAmount" 
                       min="10" max="5000" value="100" step="10"
                       style="width: 100%;
                              padding: 15px;
                              border: 2px solid rgba(255,215,0,0.4);
                              background: rgba(0,0,0,0.6);
                              color: #ffd700;
                              border-radius: 10px;
                              font-size: 20px;
                              text-align: center;
                              font-weight: bold;
                              margin-bottom: 10px;">
                
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
                    <button onclick="game.setPaymentAmount(50)" class="btn" style="background: #667eea; padding: 10px;">50 ⭐</button>
                    <button onclick="game.setPaymentAmount(100)" class="btn" style="background: #667eea; padding: 10px;">100 ⭐</button>
                    <button onclick="game.setPaymentAmount(500)" class="btn" style="background: #667eea; padding: 10px;">500 ⭐</button>
                    <button onclick="game.setPaymentAmount(1000)" class="btn" style="background: #667eea; padding: 10px;">1000 ⭐</button>
                </div>
            </div>
            
            <div style="text-align: center; margin: 20px 0; padding: 15px; background: rgba(255,215,0,0.1); border-radius: 10px;">
                <div style="font-size: 14px; opacity: 0.8;">Приблизна вартість:</div>
                <div style="font-size: 28px; font-weight: bold; color: #ffd700; margin: 8px 0;">
                    <span id="usdAmount">~$1.00</span> USD
                </div>
                <div style="font-size: 12px; opacity: 0.6;">
                    1 Telegram Star ≈ $0.01
                </div>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button onclick="game.processPayment()" class="btn btn-buy" style="flex: 1; padding: 15px;">
                    💳 Створити чек
                </button>
                <button onclick="game.closePaymentModal()" class="btn" style="flex: 1; background: rgba(255,255,255,0.1); padding: 15px;">
                    Скасувати
                </button>
            </div>
        </div>
    </div>
    
    <!-- СПОВІЩЕННЯ -->
    <div class="notification" id="notification"></div>
    
    <!-- ОСНОВНИЙ КОД ГРИ -->
    <script>
// ================== CASE ROULETTE GAME ==================
// Автор: @Artemchixst | ID: 6662507956
// Версія: 2.0 - Повністю автоматична

console.log('🎮 Запуск Case Roulette...');

class CaseRouletteGame {
    constructor() {
        console.log('✅ Створення гри...');
        
        this.balance = 0;
        this.totalWon = 0;
        this.casesOpened = 0;
        this.isSpinning = false;
        this.user = null;
        this.isOwner = false;
        this.paymentAmount = 100;
        
        this.init();
    }
    
    async init() {
        console.log('⚡ Швидка ініціалізація...');
        
        try {
            // 1. Приховуємо завантаження через 500мс
            setTimeout(() => this.hideLoading(), 500);
            
            // 2. Telegram WebApp
            await this.initTelegram();
            
            // 3. Дані користувача
            await this.loadUserData();
            
            // 4. Рендер гри
            this.renderGame();
            
            // 5. Показуємо інтерфейс
            setTimeout(() => this.showGame(), 300);
            
            console.log('✅ Гра готова!');
            
        } catch (error) {
            console.error('Помилка ініціалізації:', error);
            this.showError('Помилка завантаження');
            this.emergencyLoad();
        }
    }
    
    async initTelegram() {
        try {
            if (window.Telegram?.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                
                const initData = Telegram.WebApp.initDataUnsafe;
                this.user = initData?.user || null;
                
                // Власник: ID 6662507956 або @Artemchixst
                if (this.user && (this.user.id === 6662507956 || this.user.username === 'Artemchixst')) {
                    this.isOwner = true;
                    console.log('👑 Власник виявлений!');
                }
                
                Telegram.WebApp.onEvent('invoiceClosed', (event) => {
                    this.handlePayment(event);
                });
                
            } else {
                console.log('🔧 Режим без Telegram');
                this.user = { id: 123456, username: 'test' };
            }
        } catch (error) {
            console.warn('Telegram помилка:', error);
        }
    }
    
    async loadUserData() {
        try {
            if (this.isOwner) {
                this.balance = 999999;
                console.log('👑 Власнику: 999,999 Stars');
                return;
            }
            
            const saved = localStorage.getItem('caseRouletteData');
            if (saved) {
                const data = JSON.parse(saved);
                this.balance = data.balance || 0;
                this.totalWon = data.totalWon || 0;
                this.casesOpened = data.casesOpened || 0;
            } else {
                this.balance = 10; // Бонус новому
                this.saveData();
                this.showNotification('🎁 Ласкаво просимо! +10 бонусних Stars!');
            }
        } catch (error) {
            this.balance = 10;
        }
    }
    
    saveData() {
        if (this.isOwner) return;
        
        const data = {
            balance: this.balance,
            totalWon: this.totalWon,
            casesOpened: this.casesOpened,
            timestamp: Date.now()
        };
        
        localStorage.setItem('caseRouletteData', JSON.stringify(data));
    }
    
    hideLoading() {
        const loading = document.getElementById('loadingScreen');
        if (loading) {
            loading.classList.add('hidden');
            setTimeout(() => loading.style.display = 'none', 300);
        }
    }
    
    showGame() {
        const container = document.getElementById('mainContainer');
        if (container) {
            container.style.display = 'flex';
        }
        this.updateUI();
    }
    
    renderGame() {
        this.renderCases();
        this.updateUI();
    }
    
    renderCases() {
        const container = document.getElementById('casesContainer');
        if (!container) return;
        
        const cases = [
            { id: 1, name: 'Звичайний', price: 1, icon: '🎁', color: '#FF6B6B' },
            { id: 2, name: 'Рідкісний', price: 3, icon: '📦', color: '#4ECDC4' },
            { id: 3, name: 'Епічний', price: 5, icon: '💼', color: '#9B59B6' },
            { id: 4, name: 'Легендарний', price: 10, icon: '👑', color: '#FFD700' }
        ];
        
        let html = '';
        cases.forEach(caseItem => {
            html += `
                <div class="case" style="--case-color: ${caseItem.color}" 
                     onclick="game.openCase(${caseItem.id}, ${caseItem.price})">
                    <div class="case-icon">${caseItem.icon}</div>
                    <div class="case-name">${caseItem.name}</div>
                    <div class="case-price">
                        <span class="star-icon">⭐</span>${caseItem.price}
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
    }
    
    // ГЕЙМПЛЕЙ
    openCase(caseId, price) {
        if (this.isSpinning) return;
        
        if (this.balance < price) {
            this.showNotification(`Недостатньо Stars! Потрібно ${price} ⭐`);
            this.showPaymentModal();
            return;
        }
        
        this.isSpinning = true;
        this.balance -= price;
        this.casesOpened++;
        this.updateUI();
        this.saveData();
        
        // Проста анімація
        this.showCaseAnimation(caseId);
        
        // Розрахунок виграшу
        setTimeout(() => {
            const winAmount = this.calculateWin(price);
            
            if (winAmount > 0) {
                this.balance += winAmount;
                this.totalWon += winAmount;
                this.showNotification(`🎉 Виграш ${winAmount} Stars!`);
                this.createConfetti();
            } else {
                this.showNotification('😔 Наступного разу!');
            }
            
            this.updateUI();
            this.saveData();
            this.isSpinning = false;
            
        }, 1500);
    }
    
    calculateWin(price) {
        const random = Math.random();
        if (random < 0.01) return price * 10;      // 1%
        if (random < 0.06) return price * 3;       // 5%
        if (random < 0.16) return price * 2;       // 10%
        if (random < 0.66) return price * 1;       // 50%
        return 0;                                  // 34%
    }
    
    showCaseAnimation(caseId) {
        const caseElement = document.querySelector(`.case:nth-child(${caseId})`);
        if (caseElement) {
            caseElement.style.transform = 'scale(0.9)';
            setTimeout(() => caseElement.style.transform = 'scale(1)', 300);
        }
    }
    
    // ОПЛАТА
    showPaymentModal() {
        if (this.isOwner) {
            this.balance += 1000;
            this.updateUI();
            this.showNotification('👑 Власнику +1000 Stars!');
            return;
        }
        
        const modal = document.getElementById('paymentModal');
        if (modal) {
            modal.classList.add('active');
            this.updateUsdAmount();
            
            setTimeout(() => {
                const input = document.getElementById('starsAmount');
                if (input) input.focus();
            }, 100);
        }
    }
    
    closePaymentModal() {
        const modal = document.getElementById('paymentModal');
        if (modal) modal.classList.remove('active');
    }
    
    setPaymentAmount(amount) {
        const input = document.getElementById('starsAmount');
        if (input) {
            input.value = amount;
            this.updateUsdAmount();
        }
    }
    
    updateUsdAmount() {
        const input = document.getElementById('starsAmount');
        const usd = document.getElementById('usdAmount');
        if (input && usd) {
            const amount = parseInt(input.value) || 100;
            usd.textContent = `~$${(amount * 0.01).toFixed(2)}`;
        }
    }
    
    async processPayment() {
        const input = document.getElementById('starsAmount');
        if (!input) return;
        
        const amount = parseInt(input.value) || 100;
        
        if (amount < 10) {
            this.showNotification('❌ Мінімум: 10 Stars');
            return;
        }
        
        if (amount > 5000) {
            this.showNotification('❌ Максимум: 5,000 Stars');
            return;
        }
        
        this.closePaymentModal();
        
        if (this.isOwner) {
            this.balance += amount;
            this.updateUI();
            this.showNotification(`👑 Власнику +${amount} Stars!`);
            return;
        }
        
        if (!window.Telegram?.WebApp) {
            this.showNotification('⚠️ Тільки в Telegram');
            return;
        }
        
        try {
            Telegram.WebApp.openInvoice({
                title: `Case Roulette - ${amount} Stars`,
                description: 'Поповнення балансу',
                currency: 'XTR',
                prices: [{ label: `${amount} Telegram Stars`, amount: amount }],
                payload: `payment_${Date.now()}`,
                provider_token: "",
                photo_url: 'https://xstgifts.vercel.app/star-icon.png',
                photo_size: 256
            });
            
        } catch (error) {
            console.error('Помилка чеку:', error);
            this.showNotification('❌ Помилка платежу');
        }
    }
    
    handlePayment(event) {
        console.log('💳 Результат оплати:', event);
        
        if (!event) return;
        
        switch (event.status) {
            case 'paid':
                const amount = event.amount || this.paymentAmount || 100;
                this.balance += amount;
                this.updateUI();
                this.saveData();
                this.showNotification(`🎉 +${amount} Stars!`);
                this.createConfetti();
                break;
                
            case 'failed':
                this.showNotification('❌ Оплата не вдалася');
                break;
                
            case 'cancelled':
                this.showNotification('🚫 Скасовано');
                break;
        }
    }
    
    // ДОПОМІЖНІ ФУНКЦІЇ
    updateUI() {
        const balanceEl = document.getElementById('balance');
        const casesCountEl = document.getElementById('casesCount');
        const totalWonEl = document.getElementById('totalWon');
        
        if (balanceEl) {
            balanceEl.textContent = this.balance;
            if (this.isOwner) {
                balanceEl.innerHTML = `👑 ${this.balance}`;
            }
        }
        if (casesCountEl) casesCountEl.textContent = this.casesOpened;
        if (totalWonEl) totalWonEl.textContent = this.totalWon;
    }
    
    showStats() {
        const stats = `
💰 Баланс: ${this.balance} Stars
🎁 Кейсів: ${this.casesOpened}
🏆 Виграно: ${this.totalWon} Stars
📈 Середній: ${this.casesOpened > 0 ? (this.totalWon / this.casesOpened).toFixed(1) : 0} Stars
        `;
        
        if (window.Telegram?.WebApp) {
            Telegram.WebApp.showAlert(stats);
        } else {
            alert(stats);
        }
    }
    
    showNotification(message) {
        const notification = document.getElementById('notification');
        if (!notification) return;
        
        notification.textContent = message;
        notification.classList.add('show');
        
        setTimeout(() => {
            notification.classList.remove('show');
        }, 3000);
    }
    
    showError(message) {
        this.showNotification(`❌ ${message}`);
    }
    
    createConfetti() {
        for (let i = 0; i < 15; i++) {
            setTimeout(() => {
                const confetti = document.createElement('div');
                confetti.innerHTML = '⭐';
                confetti.style.position = 'fixed';
                confetti.style.fontSize = '20px';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-50px';
                confetti.style.zIndex = '9999';
                confetti.style.color = '#ffd700';
                
                document.body.appendChild(confetti);
                
                confetti.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(${window.innerHeight}px) rotate(360deg)`, opacity: 0 }
                ], {
                    duration: 2000,
                    easing: 'cubic-bezier(0.215, 0.610, 0.355, 1)'
                }).onfinish = () => confetti.remove();
            }, i * 100);
        }
    }
    
    emergencyLoad() {
        console.log('🚨 Аварійне завантаження...');
        
        const loading = document.getElementById('loadingScreen');
        if (loading) loading.style.display = 'none';
        
        const container = document.getElementById('mainContainer');
        if (container) container.style.display = 'flex';
        
        this.renderCases();
        this.balance = 100;
        this.updateUI();
        
        this.showNotification('⚠️ Аварійний режим');
    }
}

// ================== ЗАПУСК ГРИ ==================

let game = null;

window.addEventListener('DOMContentLoaded', () => {
    console.log('📄 DOM готовий...');
    
    game = new CaseRouletteGame();
    
    // Обробники подій
    const starsInput = document.getElementById('starsAmount');
    if (starsInput) {
        starsInput.addEventListener('input', () => {
            if (game) game.updateUsdAmount();
        });
    }
    
    const paymentModal = document.getElementById('paymentModal');
    if (paymentModal) {
        paymentModal.addEventListener('click', (e) => {
            if (e.target === paymentModal) {
                game.closePaymentModal();
            }
        });
    }
});

// ================== АВАРІЙНИЙ РЕЖИМ ==================
// Якщо гра не завантажилась за 3 секунди

setTimeout(() => {
    const loading = document.getElementById('loadingScreen');
    const container = document.getElementById('mainContainer');
    
    if (loading && loading.style.display !== 'none') {
        console.log('⚠️ Примусове закриття завантаження');
        loading.style.display = 'none';
    }
    
    if (container && container.style.display === 'none') {
        console.log('🚨 Аварійне включення гри');
        container.style.display = 'flex';
        
        // Створюємо просту гру
        if (!window.game) {
            window.game = {
                balance: 100,
                totalWon: 0,
                casesOpened: 0,
                isSpinning: false,
                
                openCase: function(id, price) {
                    if (this.balance < price) {
                        alert(`Потрібно ${price} ⭐`);
                        return;
                    }
                    
                    this.balance -= price;
                    this.casesOpened++;
                    
                    const random = Math.random();
                    let win = 0;
                    
                    if (random < 0.01) win = price * 10;
                    else if (random < 0.06) win = price * 3;
                    else if (random < 0.16) win = price * 2;
                    else if (random < 0.66) win = price * 1;
                    
                    if (win > 0) {
                        this.balance += win;
                        this.totalWon += win;
                        alert(`🎉 Виграли ${win} Stars!`);
                    } else {
                        alert('😔 Не пощастило');
                    }
                    
                    this.updateUI();
                },
                
                updateUI: function() {
                    const balanceEl = document.getElementById('balance');
                    const casesCountEl = document.getElementById('casesCount');
                    const totalWonEl = document.getElementById('totalWon');
                    
                    if (balanceEl) balanceEl.textContent = this.balance;
                    if (casesCountEl) casesCountEl.textContent = this.casesOpened;
                    if (totalWonEl) totalWonEl.textContent = this.totalWon;
                },
                
                showPaymentModal: function() {
                    alert('💰 Функція оплати тимчасово недоступна');
                },
                
                showStats: function() {
                    alert(`Баланс: ${this.balance} ⭐\nКейсів: ${this.casesOpened}\nВиграш: ${this.totalWon} ⭐`);
                },
                
                setPaymentAmount: function(amount) {
                    const input = document.getElementById('starsAmount');
                    if (input) input.value = amount;
                },
                
                processPayment: function() {
                    alert('💳 Оплата тимчасово недоступна');
                },
                
                closePaymentModal: function() {
                    const modal = document.getElementById('paymentModal');
                    if (modal) modal.classList.remove('active');
                }
            };
            
            // Рендеримо кейси
            const container = document.getElementById('casesContainer');
            if (container && container.innerHTML === '') {
                container.innerHTML = `
                    <div class="case" style="--case-color: #FF6B6B" onclick="game.openCase(1, 1)">
                        <div class="case-icon">🎁</div><div class="case-name">Звичайний</div>
                        <div class="case-price"><span class="star-icon">⭐</span>1</div>
                    </div>
                    <div class="case" style="--case-color: #4ECDC4" onclick="game.openCase(2, 3)">
                        <div class="case-icon">📦</div><div class="case-name">Рідкісний</div>
                        <div class="case-price"><span class="star-icon">⭐</span>3</div>
                    </div>
                    <div class="case" style="--case-color: #9B59B6" onclick="game.openCase(3, 5)">
                        <div class="case-icon">💼</div><div class="case-name">Епічний</div>
                        <div class="case-price"><span class="star-icon">⭐</span>5</div>
                    </div>
                    <div class="case" style="--case-color: #FFD700" onclick="game.openCase(4, 10)">
                        <div class="case-icon">👑</div><div class="case-name">Легендарний</div>
                        <div class="case-price"><span class="star-icon">⭐</span>10</div>
                    </div>
                `;
            }
        }
        
        console.log('✅ Аварійний режим активовано!');
    }
}, 3000); // 3 секунди

// Експорт
window.CaseRouletteGame = CaseRouletteGame;
